<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Workspace</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f4f7fb;color:#172033}.wrap{max-width:1050px;margin:35px auto;padding:18px}.top{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:20px}.top h1{margin:0;color:#0f4c81;font-size:28px}.top p{margin:6px 0 0;color:#667085}.card{background:#fff;border:1px solid #e5eaf1;border-radius:16px;padding:24px;box-shadow:0 8px 30px rgba(15,76,129,.07);margin-bottom:18px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.stat{border:1px solid #e5eaf1;border-radius:12px;padding:18px;background:#fafcff}.stat b{display:block;font-size:25px;color:#0f4c81;margin-top:6px}.label{font-size:12px;color:#667085;font-weight:700}.btn,.link{display:inline-block;border:0;border-radius:9px;padding:11px 15px;background:#0f4c81;color:#fff;font-weight:700;text-decoration:none;cursor:pointer}.link.alt{background:#edf6ff;color:#0f4c81}.note{color:#667085;line-height:1.7}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:7px}.day{background:#fafcff;border:1px solid #e5eaf1;border-radius:8px;padding:10px;text-align:center;font-size:12px}.head{font-weight:800;color:#0f4c81;background:#edf6ff}.list{display:grid;gap:10px}.row{padding:13px;border:1px solid #e5eaf1;border-radius:10px;background:#fff}.actions{display:flex;gap:10px;flex-wrap:wrap}@media(max-width:700px){.grid{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}.calendar{gap:4px}.day{padding:8px 3px;font-size:10px}}</style></head><body><div class="wrap"><div class="top"><div><h1 id="title">Workspace</h1><p id="subtitle">Manage your business activity.</p></div><a class="btn" href="dashboard.html?v=4">← Dashboard</a></div><div id="content"></div></div><script type="module">import{initializeApp}from"https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";import{getAuth,onAuthStateChanged,signOut}from"https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";import{getFirestore,collection,query,where,getDocs}from"https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";import{firebaseConfig}from"./js/firebase-config.js";const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app);const m=new URLSearchParams(location.search).get('module')||'documents';const names={documents:'Documents',reports:'Reports',calendar:'Calendar',settings:'Settings'};const n=names[m]||'Workspace';document.title=n;document.getElementById('title').textContent=n;const content=document.getElementById('content');const esc=v=>String(v??'').replace(/[&<>"]/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[x]));
function shell(html){content.innerHTML=html}
function calendar(){const d=new Date(),year=d.getFullYear(),month=d.getMonth(),first=new Date(year,month,1).getDay(),days=new Date(year,month+1,0).getDate();let h='<div class="card"><h2>'+d.toLocaleString(undefined,{month:'long',year:'numeric'})+'</h2><div class="calendar">';['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].forEach(x=>h+='<div class="day head">'+x+'</div>');for(let i=0;i<first;i++)h+='<div class="day"></div>';for(let i=1;i<=days;i++)h+='<div class="day">'+i+'</div>';h+='</div></div><div class="card"><h3>Appointments & Tasks</h3><p class="note">No appointments have been added yet. Use this workspace to plan follow-ups, customer calls and service deadlines.</p></div>';shell(h)}
async function reports(uid){shell('<div class="card"><p class="note">Loading report...</p></div>');try{const q=query(collection(db,'applications'),where('businessId','==',uid));const snap=await getDocs(q);let pending=0,approved=0,completed=0; snap.forEach(x=>{const s=x.data().status;if(s==='approved')approved++;if(s==='completed')completed++;if(s==='pending'||s==='in_review')pending++});shell('<div class="grid"><div class="stat"><span class="label">TOTAL APPLICATIONS</span><b>'+snap.size+'</b></div><div class="stat"><span class="label">PENDING / REVIEW</span><b>'+pending+'</b></div><div class="stat"><span class="label">APPROVED</span><b>'+approved+'</b></div><div class="stat"><span class="label">COMPLETED</span><b>'+completed+'</b></div></div><div class="card"><h3>Business Activity</h3><p class="note">This report is calculated from applications belonging only to your business account.</p></div>')}catch(e){shell('<div class="card"><h3>Report unavailable</h3><p class="note">Please check your Firestore rules and refresh the page.</p></div>')}}
function documents(){shell('<div class="card"><h3>Business Documents</h3><p class="note">Keep your business document checklist and notes here. Customer application details are stored securely in Firestore.</p><div class="list"><div class="row"><b>Document checklist</b><br><span class="note">PAN, GST, registration, address proof and other business records.</span></div><div class="row"><b>Customer documents</b><br><span class="note">Document binary upload is not enabled in this project because Firebase Storage was not enabled. You can record document requirements in each service.</span></div></div></div>')} 
function settings(user){shell('<div class="card"><h3>Account Settings</h3><div class="list"><div class="row"><b>Email</b><br>'+esc(user.email||'')+'</div><div class="row"><b>Account</b><br>Business Owner</div></div><div class="actions" style="margin-top:18px"><a class="link alt" href="business-profile.html?v=4">Business Profile</a><button class="btn" id="logout">Logout</button></div></div>');document.getElementById('logout').onclick=async()=>{await signOut(auth);location.href='index.html'}}
onAuthStateChanged(auth,user=>{if(!user){location.href='index.html';return}if(m==='calendar')calendar();else if(m==='reports')reports(user.uid);else if(m==='settings')settings(user);else documents()});</script></body></html>
