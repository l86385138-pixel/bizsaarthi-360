name: Add Admin Password Reset

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/add-admin-password-reset.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add password reset option
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('admin.html')
          s=p.read_text(encoding='utf-8')

          s=s.replace('signInWithEmailAndPassword,signOut', 'signInWithEmailAndPassword,signOut,sendPasswordResetEmail')

          old='<button class="btn" type="submit">Admin Login</button></form><div class="danger">'
          new='<button class="btn" type="submit">Admin Login</button></form><button type="button" id="forgotPassword" class="btn light" style="width:100%;margin-top:10px">Forgot / Reset Password</button><div id="resetMsg" class="msg"></div><div class="danger">'
          if old in s and 'id="forgotPassword"' not in s:
              s=s.replace(old,new,1)

          old2='<span id="adminEmail" class="user"></span><button class="btn light" id="logout">Logout</button>'
          new2='<span id="adminEmail" class="user"></span><button class="btn light" id="resetPasswordTop">Reset Password</button><button class="btn light" id="logout">Logout</button>'
          if old2 in s and 'id="resetPasswordTop"' not in s:
              s=s.replace(old2,new2,1)

          anchor='function loginMsg(t,type="err"){const e=$("loginMsg");e.textContent=t;e.className="msg show "+type}'
          add='''function resetMsg(t,type="ok"){const e=$("resetMsg");if(!e)return;e.textContent=t;e.className="msg show "+type}

          async function sendReset(email){
            email=(email||$("email").value||"").trim();
            if(!email){resetMsg("Enter your admin email first.","err");$("email").focus();return}
            resetMsg("Sending password reset email...","ok");
            try{
              await sendPasswordResetEmail(auth,email);
              resetMsg("Password reset email sent. Check your inbox and spam folder.","ok");
            }catch(e){
              console.error(e);
              resetMsg("Could not send reset email. Check the email address and Firebase Authentication settings.","err");
            }
          }
          '''
          if anchor in s and 'async function sendReset(email)' not in s:
              s=s.replace(anchor,anchor+'\n'+add,1)

          anchor2='$("logout").onclick=()=>signOut(auth);'
          add2='''$("forgotPassword").onclick=()=>sendReset();
          $("resetPasswordTop").onclick=()=>sendReset(auth.currentUser?.email||$("email").value||"");'''
          if anchor2 in s and '$("forgotPassword").onclick' not in s:
              s=s.replace(anchor2,anchor2+'\n'+add2,1)

          p.write_text(s,encoding='utf-8')
          PY

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin.html
          git diff --cached --quiet && exit 0
          git commit -m "Add admin password reset option [skip ci]"
          git push
