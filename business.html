<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="description" content="Business services and contact information">
<title>Business | BizSaarthi 360</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f5f7fb;color:#172033}.wrap{max-width:1050px;margin:auto;padding:20px}.card{background:#fff;border:1px solid #e5eaf1;border-radius:18px;overflow:hidden;box-shadow:0 8px 30px rgba(15,76,129,.08)}.hero{background:linear-gradient(135deg,#0f4c81,#1769aa);color:#fff;padding:32px;display:flex;gap:22px;align-items:center}.logo{width:100px;height:100px;border-radius:18px;background:#fff;color:#0f4c81;display:flex;align-items:center;justify-content:center;font-size:38px;font-weight:800;overflow:hidden;flex:none}.logo img{width:100%;height:100%;object-fit:cover}.hero h1{margin:0 0 8px;font-size:30px}.hero p{margin:4px 0;opacity:.9}.body{padding:28px}.section{margin-bottom:28px}.section h2{font-size:19px;margin:0 0 12px}.about{line-height:1.7;color:#536174;white-space:pre-wrap}.info{border:1px solid #e5eaf1;border-radius:12px;padding:15px;background:#fafcff}.value{font-size:14px;word-break:break-word}.links{display:flex;flex-wrap:wrap;gap:10px}.links a{display:inline-block;padding:10px 14px;border-radius:9px;background:#eef6ff;color:#0f4c81;text-decoration:none;font-weight:700;font-size:13px}.services{display:grid;grid-template-columns:repeat(2,1fr);gap:15px}.service{border:1px solid #e5eaf1;border-radius:14px;padding:18px;background:#fff}.service h3{margin:0 0 8px;font-size:17px}.service p{color:#667085;font-size:13px;line-height:1.6;margin:0 0 10px;white-space:pre-wrap}.price{font-weight:800;color:#0f4c81;margin-bottom:10px}.docs{font-size:11px;color:#718096;line-height:1.5}.apply{display:inline-block;margin-top:14px;padding:10px 14px;background:#0f4c81;color:#fff;border-radius:8px;text-decoration:none;font-weight:700;font-size:12px}.empty,.error{text-align:center;padding:28px;border:1px dashed #cbd5e1;border-radius:12px;color:#718096}.error{border:0;padding:60px 20px}footer{text-align:center;padding:22px;color:#7b8798;font-size:12px}@media(max-width:650px){.wrap{padding:10px}.hero{padding:22px;align-items:flex-start}.hero h1{font-size:23px}.logo{width:75px;height:75px;font-size:28px}.body{padding:20px}.services{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
<div class="card" id="app"><div class="error"><h1>Loading...</h1><p>Please wait.</p></div></div>
<footer>© Great India Technology. All Rights Reserved.</footer>
</div>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";
import{getFirestore,collection,query,where,getDocs}from"https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";
import{firebaseConfig}from"./js/firebase-config.js";

const firebaseApp=initializeApp(firebaseConfig);
const db=getFirestore(firebaseApp);
const root=document.getElementById('app');
const params=new URLSearchParams(location.search);
const slug=(params.get('business')||'').trim();

const esc=(value)=>String(value??'').replace(/[&<>\"]/g,char=>({"&":"&amp;","<":"&lt;",">":"&gt;",'\"':'&quot;'}[char]));
const normalizeUrl=(value)=>{
  const v=String(value||'').trim();
  if(!v)return '';
  if(/^https?:\/\//i.test(v))return v;
  return 'https://'+v;
};
const fail=(title,message)=>{
  root.innerHTML=`<div class="error"><h1>${esc(title)}</h1><p>${esc(message)}</p><p style="font-size:12px;margin-top:14px">If this page was just published, refresh after Firebase Firestore rules are published.</p></div>`;
};

if(!slug){
  fail('Business page not found','The public business link is missing the business name.');
}else{
  loadBusiness().catch(error=>{
    console.error('Public business page error:',error);
    const code=error?.code||'';
    if(code.includes('permission-denied')){
      fail('Permission denied','Firestore rules are blocking the public business page. Publish the latest firestore.rules in Firebase Console.');
    }else{
      fail('Unable to open business page','The business profile could not be loaded. Please check Firebase configuration and Firestore data.');
    }
  });
}

async function loadBusiness(){
  const businessQuery=query(collection(db,'businesses'),where('publicSlug','==',slug));
  const businessSnapshot=await getDocs(businessQuery);
  if(businessSnapshot.empty){
    fail('Business not found','This public link is invalid or the business profile has not been saved with this public slug.');
    return;
  }

  const businessDoc=businessSnapshot.docs[0];
  const business=businessDoc.data()||{};
  const businessId=businessDoc.id;
  const ownerId=business.ownerId||businessId;
  const name=business.businessName||'Business';
  const address=[business.officeAddress,business.city,business.state,business.pinCode].filter(Boolean).join(', ');

  let logo=esc(name.charAt(0).toUpperCase());
  if(business.logoData && String(business.logoData).startsWith('data:image/')){
    logo=`<img src="${business.logoData}" alt="${esc(name)} logo">`;
  }

  const links=[];
  if(business.mobile){
    const phone=String(business.mobile).replace(/[^0-9+]/g,'');
    links.push(`<a href="tel:${esc(phone)}">Call ${esc(business.mobile)}</a>`);
  }
  if(business.whatsapp){
    const whatsapp=String(business.whatsapp).replace(/\D/g,'');
    if(whatsapp)links.push(`<a href="https://wa.me/${whatsapp}" target="_blank" rel="noopener noreferrer">WhatsApp</a>`);
  }
  const website=normalizeUrl(business.website);
  if(website)links.push(`<a href="${esc(website)}" target="_blank" rel="noopener noreferrer">Website</a>`);
  const facebook=normalizeUrl(business.facebook);
  if(facebook)links.push(`<a href="${esc(facebook)}" target="_blank" rel="noopener noreferrer">Facebook</a>`);
  const instagram=normalizeUrl(business.instagram);
  if(instagram)links.push(`<a href="${esc(instagram)}" target="_blank" rel="noopener noreferrer">Instagram</a>`);

  let serviceDocs=[];
  try{
    serviceDocs=await getDocs(query(collection(db,'services'),where('businessId','==',businessId),where('status','==','active')));
  }catch(firstError){
    console.warn('Service query by business document id failed:',firstError);
  }

  if(serviceDocs.length===0 && ownerId!==businessId){
    try{
      serviceDocs=await getDocs(query(collection(db,'services'),where('businessId','==',ownerId),where('status','==','active')));
    }catch(secondError){
      console.warn('Service query by owner id failed:',secondError);
    }
  }

  let services='';
  serviceDocs.forEach(serviceDoc=>{
    const service=serviceDoc.data()||{};
    const serviceName=service.serviceName||'Service';
    const description=service.description||'Service details are available on request.';
    const price=service.price||'Contact for price';
    const docs=service.requiredDocuments||'Not specified';
    const applyUrl=`customer-login.html?business=${encodeURIComponent(slug)}&service=${encodeURIComponent(serviceDoc.id)}`;
    services+=`<article class="service"><h3>${esc(serviceName)}</h3><p>${esc(description)}</p><div class="price">${esc(price)}</div><div class="docs"><b>Required Documents:</b> ${esc(docs)}</div><a class="apply" href="${applyUrl}">Apply Now</a></article>`;
  });

  if(!services)services='<div class="empty">No active services have been published yet.</div>';

  root.innerHTML=`
  <div class="hero">
    <div class="logo">${logo}</div>
    <div>
      <h1>${esc(name)}</h1>
      ${business.ownerName?`<p>Owner: ${esc(business.ownerName)}</p>`:''}
      ${address?`<p>${esc(address)}</p>`:''}
    </div>
  </div>
  <div class="body">
    <div class="section">
      <h2>About Business</h2>
      <div class="about">${esc(business.description||'Business information will be available here.')}</div>
    </div>
    ${address?`<div class="section"><h2>Office Address</h2><div class="info"><div class="value">${esc(address)}</div></div></div>`:''}
    <div class="section"><h2>Our Services</h2><div class="services">${services}</div></div>
    ${links.length?`<div class="section"><h2>Contact</h2><div class="links">${links.join('')}</div></div>`:''}
  </div>`;
  document.title=`${name} | BizSaarthi 360`;
}
</script>
</body>
</html>
