<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Services | BizSaarthi 360</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}body{font-family:Arial,Helvetica,sans-serif;background:#f4f7fb;color:#172033}.sidebar{width:250px;background:#0f4c81;color:#fff;position:fixed;inset:0 auto 0 0;padding:22px 15px;z-index:100}.brand{display:flex;align-items:center;gap:10px;padding:5px 10px 28px;font-size:20px;font-weight:700}.logo-box{width:38px;height:38px;border-radius:10px;background:#fff;color:#0f4c81;display:flex;align-items:center;justify-content:center;font-weight:800}.brand strong{color:#8ed1ff}.menu-title{font-size:11px;text-transform:uppercase;opacity:.65;padding:0 12px 10px}.menu{display:flex;flex-direction:column;gap:5px}.menu button{width:100%;border:0;background:transparent;color:#fff;padding:12px;border-radius:9px;text-align:left;cursor:pointer;font-size:14px}.menu button:hover,.menu button.active{background:rgba(255,255,255,.14)}.menu button span{display:inline-block;width:28px}.logout-btn{margin-top:20px;border-top:1px solid rgba(255,255,255,.15)!important;padding-top:18px!important}.main{margin-left:250px;min-height:100vh}.topbar{height:72px;background:#fff;border-bottom:1px solid #e5eaf1;display:flex;align-items:center;justify-content:space-between;padding:0 30px}.top-left{display:flex;align-items:center;gap:14px}.mobile-menu{display:none;border:0;background:transparent;font-size:22px}.topbar h1{font-size:21px}.topbar p{font-size:12px;color:#718096;margin-top:3px}.user-area{display:flex;align-items:center;gap:12px}.user-info{text-align:right}.user-name{font-size:14px;font-weight:700}.user-role{font-size:11px;color:#718096;margin-top:3px}.avatar{width:42px;height:42px;border-radius:50%;background:#e7f2fb;color:#0f4c81;display:flex;align-items:center;justify-content:center;font-weight:800}.content{padding:30px;max-width:1250px;margin:auto}.heading{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}.heading h2{font-size:25px}.heading p{font-size:13px;color:#718096;margin-top:5px}.btn{border:0;border-radius:9px;padding:12px 18px;font-weight:700;cursor:pointer}.primary{background:#0f4c81;color:#fff}.secondary{background:#edf2f7;color:#344054}.message{display:none;padding:13px 15px;border-radius:9px;margin-bottom:18px;font-size:13px}.message.show{display:block}.success{background:#e9f8ef;color:#18794e;border:1px solid #bce8ce}.error{background:#fff0f0;color:#c62828;border:1px solid #f1c0c0}.card{background:#fff;border:1px solid #e5eaf1;border-radius:15px;margin-bottom:20px;overflow:hidden}.form-body{padding:23px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}.full{grid-column:1/-1}.group{display:flex;flex-direction:column;gap:7px}.group label{font-size:12px;font-weight:700;color:#344054}input,textarea,select{width:100%;border:1px solid #d9e0e8;border-radius:9px;padding:12px;font-size:13px;outline:none}input:focus,textarea:focus,select:focus{border-color:#1769aa;box-shadow:0 0 0 3px rgba(23,105,170,.09)}textarea{min-height:100px;resize:vertical}.form-actions{display:flex;justify-content:flex-end;gap:10px;padding:18px 23px;border-top:1px solid #edf0f4}.services{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.service{background:#fff;border:1px solid #e5eaf1;border-radius:14px;padding:20px}.service h3{font-size:16px;margin-bottom:8px}.service .desc{font-size:12px;color:#667085;line-height:1.6;min-height:42px}.price{font-size:19px;font-weight:800;color:#0f4c81;margin:14px 0}.docs{font-size:11px;color:#718096;margin-bottom:14px}.badge{display:inline-block;padding:5px 9px;border-radius:20px;font-size:10px;background:#e9f8ef;color:#18794e}.inactive{background:#f1f3f5;color:#667085}.service-actions{display:flex;gap:8px;margin-top:15px}.service-actions button{flex:1}.empty{text-align:center;padding:50px;color:#718096;background:#fff;border:1px dashed #cbd5e1;border-radius:14px;grid-column:1/-1}.loading{position:fixed;inset:0;background:#fff;z-index:999;display:flex;align-items:center;justify-content:center;font-size:14px;color:#718096}@media(max-width:1000px){.services{grid-template-columns:repeat(2,1fr)}}@media(max-width:768px){.sidebar{transform:translateX(-100%);transition:.25s}.sidebar.open{transform:translateX(0)}.main{margin-left:0}.mobile-menu{display:block}.topbar{padding:0 16px}.user-info{display:none}.content{padding:18px}.heading{align-items:flex-start;gap:12px;flex-direction:column}.grid{grid-template-columns:1fr}.full{grid-column:auto}.services{grid-template-columns:1fr}.overlay.active{display:block;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:90}.form-actions{flex-direction:column}.form-actions .btn{width:100%}}
</style></head><body>
<div class="loading" id="loading">Checking account...</div><div class="overlay" id="overlay"></div>
<aside class="sidebar" id="sidebar"><div class="brand"><div class="logo-box">B</div><div>Biz<strong>Saarthi</strong> 360</div></div><div class="menu-title">Workspace</div><nav class="menu"><button onclick="location.href='dashboard.html'"><span>⌂</span>Dashboard</button><button onclick="location.href='business-profile.html'"><span>🏢</span>Business Profile</button><button class="active"><span>▣</span>Services</button><button onclick="comingSoon('Documents')"><span>▤</span>Documents</button><button onclick="comingSoon('Customers')"><span>♙</span>Customers</button><button onclick="comingSoon('Reports')"><span>▥</span>Reports</button><button onclick="comingSoon('Calendar')"><span>□</span>Calendar</button><button onclick="comingSoon('Settings')"><span>⚙</span>Settings</button><button class="logout-btn" id="logoutBtn"><span>↪</span>Logout</button></nav></aside>
<main class="main"><header class="topbar"><div class="top-left"><button class="mobile-menu" id="mobileMenu">☰</button><div><h1>Services</h1><p>Create and manage customer services</p></div></div><div class="user-area"><div class="user-info"><div class="user-name" id="userName">User</div><div class="user-role">Business Owner</div></div><div class="avatar" id="avatar">U</div></div></header>
<section class="content"><div class="heading"><div><h2>My Services</h2><p>Add services that customers can view and apply for.</p></div><button class="btn primary" id="newBtn">+ Add Service</button></div><div class="message" id="message"></div>
<div class="card" id="formCard" style="display:none"><form id="serviceForm"><div class="form-body"><div class="grid"><div class="group"><label>Service Name *</label><input id="serviceName" required placeholder="e.g. ITR Filing"></div><div class="group"><label>Price / Fee</label><input id="price" placeholder="e.g. ₹999"></div><div class="group full"><label>Description *</label><textarea id="description" required placeholder="Describe this service..."></textarea></div><div class="group full"><label>Required Documents</label><textarea id="requiredDocuments" placeholder="Aadhaar Card, PAN Card, Bank Statement"></textarea></div><div class="group"><label>Status</label><select id="status"><option value="active">Active</option><option value="inactive">Inactive</option></select></div></div></div><div class="form-actions"><button type="button" class="btn secondary" id="cancelBtn">Cancel</button><button type="submit" class="btn primary" id="saveBtn">Save Service</button></div></form></div>
<div class="services" id="servicesList"></div></section></main>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";import{getAuth,onAuthStateChanged,signOut}from"https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";import{getFirestore,collection,query,where,getDocs,doc,addDoc,updateDoc,deleteDoc,serverTimestamp}from"https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";import{firebaseConfig}from"./js/firebase-config.js";
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app);let uid=null,editId=null;const $=id=>document.getElementById(id),msg=(t,c='success')=>{$('message').textContent=t;$('message').className='message show '+c;setTimeout(()=>{$('message').className='message'},3500)};
function showForm(edit=false){$('formCard').style.display='block';if(!edit){editId=null;$('serviceForm').reset();$('status').value='active';$('saveBtn').textContent='Save Service'}window.scrollTo({top:0,behavior:'smooth'})}function hideForm(){editId=null;$('formCard').style.display='none';$('serviceForm').reset()}
async function loadServices(){const list=$('servicesList');list.innerHTML='<div class="empty">Loading services...</div>';try{const q=query(collection(db,'services'),where('businessId','==',uid));const snap=await getDocs(q);if(snap.empty){list.innerHTML='<div class="empty"><h3>No services yet</h3><p style="margin-top:8px">Click “Add Service” to create your first service.</p></div>';return}list.innerHTML='';snap.forEach(s=>{const d=s.data();const docs=d.requiredDocuments||'Not specified';const el=document.createElement('article');el.className='service';el.innerHTML=`<h3>${safe(d.serviceName||'Untitled Service')}</h3><div class="desc">${safe(d.description||'')}</div><div class="price">${safe(d.price||'Contact for price')}</div><div class="docs"><b>Required:</b> ${safe(docs)}</div><span class="badge ${d.status==='inactive'?'inactive':''}">${d.status==='inactive'?'Inactive':'Active'}</span><div class="service-actions"><button class="btn secondary edit">Edit</button><button class="btn secondary delete">Delete</button></div>`;el.querySelector('.edit').onclick=()=>editService(s.id,d);el.querySelector('.delete').onclick=()=>removeService(s.id);list.appendChild(el)})}catch(e){console.error(e);list.innerHTML='<div class="empty">Unable to load services. Check Firestore Rules and try again.</div>'}}
function safe(v){return String(v??'').replace(/[&<>\"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[m]))}
function editService(id,d){editId=id;$('serviceName').value=d.serviceName||'';$('price').value=d.price||'';$('description').value=d.description||'';$('requiredDocuments').value=d.requiredDocuments||'';$('status').value=d.status||'active';$('saveBtn').textContent='Update Service';$('formCard').style.display='block';window.scrollTo({top:0,behavior:'smooth'})}
async function removeService(id){if(!confirm('Delete this service?'))return;try{await deleteDoc(doc(db,'services',id));msg('Service deleted.');await loadServices()}catch(e){console.error(e);msg('Delete failed. Check Firestore Rules.','error')}}
$('serviceForm').addEventListener('submit',async e=>{e.preventDefault();if(!uid)return;const data={businessId:uid,serviceName:$('serviceName').value.trim(),description:$('description').value.trim(),price:$('price').value.trim(),requiredDocuments:$('requiredDocuments').value.trim(),status:$('status').value,updatedAt:serverTimestamp()};if(!data.serviceName||!data.description){msg('Service Name and Description are required.','error');return}$('saveBtn').disabled=true;try{if(editId)await updateDoc(doc(db,'services',editId),data);else await addDoc(collection(db,'services'),{...data,createdAt:serverTimestamp()});msg(editId?'Service updated successfully.':'Service added successfully.');hideForm();await loadServices()}catch(e){console.error(e);msg(e.code==='permission-denied'?'Firestore permission denied. Publish the fixed rules first.':'Unable to save service.','error')}finally{$('saveBtn').disabled=false}});
$('newBtn').onclick=()=>showForm(false);$('cancelBtn').onclick=hideForm;$('logoutBtn').onclick=async()=>{await signOut(auth);location.href='index.html'};$('mobileMenu').onclick=()=>{$('sidebar').classList.toggle('open');$('overlay').classList.toggle('active')};$('overlay').onclick=()=>{$('sidebar').classList.remove('open');$('overlay').classList.remove('active')};window.comingSoon=n=>alert(n+' module is coming next.');
onAuthStateChanged(auth,async user=>{if(!user){location.href='index.html';return}uid=user.uid;const n=user.email||'User';$('userName').textContent=n;$('avatar').textContent=n.charAt(0).toUpperCase();$('loading').style.display='none';await loadServices()});
</script></body></html>
