name: Fix Customer Dashboard Branding

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  fix:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update customer dashboard
        shell: python
        run: |
          from pathlib import Path
          p = Path('customer-dashboard.html')
          s = p.read_text(encoding='utf-8')

          s = s.replace(
            '.brand{font-size:20px;font-weight:800;color:#0f4c81}.brand strong{color:#1769aa}',
            '.brand{display:flex;align-items:center;gap:10px;font-size:20px;font-weight:800;color:#0f4c81;min-width:0}.brand strong{color:#1769aa}.brand-logo{width:38px;height:38px;border-radius:9px;object-fit:cover;background:#e8f3fb;color:#0f4c81;display:grid;place-items:center;font-size:16px;font-weight:800;flex:0 0 38px}.brand-logo img{width:100%;height:100%;object-fit:cover;border-radius:9px}.brand-name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:360px}',
            1
          )

          s = s.replace(
            '<header class="top"><div class="brand">BizSaarthi <strong>360</strong></div><div class="user"><span id="userName">Customer</span><div class="avatar" id="avatar">C</div><button class="btn light" id="logout">Logout</button></div></header>',
            '<header class="top"><div class="brand" id="businessBrand"><div class="brand-logo" id="businessLogo">B</div><div class="brand-name" id="businessBrandName">Business</div></div><div class="user"><span id="userName">Customer</span><div class="avatar" id="avatar">C</div><button class="btn light" id="logout">Logout</button></div></header>',
            1
          )

          s = s.replace(
            'async function loadService(){',
            '''async function loadBusinessBrand(){
 try{
  let b=null;
  if(business){
   const snap=await getDocs(query(collection(db,"businesses"),where("publicSlug","==",business)));
   if(!snap.empty) b={id:snap.docs[0].id,...snap.docs[0].data()};
  }
  if(!b){
   const snap=await getDocs(query(collection(db,"applications"),where("customerId","==",uid)));
   const rows=[];
   snap.forEach(x=>rows.push({id:x.id,...x.data()}));
   rows.sort((a,z)=>(z.applicationDate?.seconds||0)-(a.applicationDate?.seconds||0));
   if(rows[0]?.businessId){
    const bs=await getDoc(doc(db,"businesses",rows[0].businessId));
    if(bs.exists()) b={id:bs.id,...bs.data()};
   }
  }
  if(!b)return;
  const name=(b.businessName||"Business").trim();
  document.getElementById("businessBrandName").textContent=name;
  document.title=name+" | Customer Dashboard";
  const logo=document.getElementById("businessLogo");
  if(b.logoData){
   logo.innerHTML="<img src=\""+esc(b.logoData)+"\" alt=\"Business logo\">";
  }else{
   logo.textContent=name.charAt(0).toUpperCase()||"B";
  }
 }catch(e){console.warn("Business branding could not be loaded",e)}
}
async function loadService(){''',
            1
          )

          s = s.replace(
            'uid=user.uid;await loadUser();await loadService();await loadApplications()',
            'uid=user.uid;await loadUser();await loadBusinessBrand();await loadService();await loadApplications()',
            1
          )

          p.write_text(s, encoding='utf-8')
          print('Customer dashboard branding updated.')

      - name: Commit fix
        run: |
          if git diff --quiet -- customer-dashboard.html; then
            echo "No customer dashboard changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add customer-dashboard.html
          git commit -m "Show public business name and logo on customer dashboard [skip ci]"
          git push
